<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf6">
  <title>Staff login | Kinyozi</title>
  <link rel="stylesheet" href="styles.css">
  <script src="staff.js" defer></script>
</head>
<body data-page="login">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">K</span> Kinyozi</a>
    <nav aria-label="Main navigation"><a href="index.html">Back to website</a></nav>
  </header>
  <main class="staff-main">
    <section class="staff-card">
      <p class="eyebrow">BARBERSHOP TEAM</p>
      <h1>Staff login</h1>
      <p class="staff-intro">Sign in to see your barber’s schedule and appointments.</p>

      <form id="login-form">
        <label class="field">
          <span>First name (username)</span>
          <input name="username" autocomplete="username" required placeholder="e.g. Peter">
        </label>
        <label class="field">
          <span>Last name (password)</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="button" type="submit">Sign in</button>
        <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
      </form>

    </section>
  </main>
  <footer class="site-footer">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">K</span> Kinyozi</a>
    <span>Sharp boy needs a clean cut</span>
    <span>© <span id="current-year"></span> Kinyozi</span>
  </footer>
</body>
</html>
