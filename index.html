<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f3f4">
    <title>Petcare — Sign in</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <main class="login-layout">
        <section class="login-side">
            <div class="login-card">
                <form id="loginForm">
                    <h1 class="login-title">PETCARE LOGIN PAGE</h1>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" autocomplete="username" required placeholder="Your username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password">
                        <button type="button" class="password-toggle" id="togglePassword" aria-controls="password" aria-pressed="false">Show password</button>
                    </div>
                    <button class="primary-button login-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
                    <p class="form-message" id="loginMessage" aria-live="polite"></p>
                    <button type="button" class="link-btn" onclick="toggleForgotPass(true)">Forgot your password?</button>
                    <button type="button" class="link-btn" onclick="toggleRegister(true)">Create an account</button>
                </form>

                <form id="registerForm" hidden>
                    <p class="eyebrow">GET STARTED</p>
                    <h2>Create your account</h2>
                    <p class="login-description">Sign up to keep your pet’s care in one place.</p>
                    <div class="form-group">
                        <label for="registerUsername">Username</label>
                        <input type="text" id="registerUsername" name="username" autocomplete="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.\-]+" placeholder="Choose a username">
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" name="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="At least 8 characters">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="Enter your password again">
                    </div>
                    <button class="primary-button login-submit" type="submit">Create account <span aria-hidden="true">→</span></button>
                    <p class="form-message" id="registerMessage" aria-live="polite"></p>
                    <button type="button" class="link-btn" onclick="toggleRegister(false)">Back to sign in</button>
                </form>

                <form id="forgotForm" hidden>
                    <p class="eyebrow">ACCOUNT HELP</p>
                    <h2>Password reset</h2>
                    <p class="login-description">Password reset is not available because this account database has no email or reset fields.</p>
                    <button type="button" class="link-btn" onclick="toggleForgotPass(false)">Back to sign in</button>
                    <p class="form-message" id="resetMessage" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
